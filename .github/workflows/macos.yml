# Builds BOTH plugins on a macOS runner and packs them into one disk image.
#
# Run it from the Actions tab ("Run workflow", pick the branch), or push a v* tag.
# To release from the Actions tab, fill in "release" with the tag to create.
# Download "Fracture-and-Crate-macOS" from the finished run.
#
# On a public repository the run is free. On a private one, macOS runner minutes
# bill at 10x, so a ~12 minute run spends about 120 minutes of the account's
# quota; that is why this builds both products in one run rather than two.
#
# A v* tag also attaches the disk image to a GitHub release. On a public
# repository its link works for anyone, so plugins-site/site.json can point at it.
name: Build both plugins for macOS

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as a release with this tag (for example v0.1.0). Leave empty to only build."
        required: false
        default: ""
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14          # Apple Silicon; the build is universal anyway
    # a new repository's token is read-only by default; the release step
    # needs to create a release and upload the disk image to it
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: .juce
          key: juce-8.0.15

      # the measurements first: they need no toolchain beyond a compiler and
      # they fail in seconds rather than after a twelve minute build
      - name: DSP measurements
        run: |
          node plugin/tests/run.mjs
          node crate/tests/run.mjs

      # the same script the user runs on their own laptop, so a green run here
      # means that script works
      - name: Build, install and validate both
        run: ./build-macos-all.sh

      - name: Disk image
        run: ./packaging/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Fracture-and-Crate-macOS
          path: dist/*.dmg
          retention-days: 30

      # A pushed v* tag releases under that tag. A run started by hand with a
      # tag in "release" makes the tag itself, on the commit it built, so a
      # release can be cut from the Actions tab (or the API) without pushing one.
      - name: Attach to a release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ inputs.release }}
        run: |
          tag="${RELEASE:-$GITHUB_REF_NAME}"
          notes="Unsigned beta build of both plugins: Audio Unit, VST3 and standalone app, for macOS 10.13 or later on Apple Silicon and Intel.

          Open the disk image, right-click 'Install both plugins.command' and choose Open. macOS warns that it is from an unidentified developer because the build is not signed; that is expected.

          Tested by machine, not yet by ear: save your project first."
          gh release create "$tag" dist/*.dmg --target "$GITHUB_SHA" \
            --title "FRACTURE and CRATE $tag" --notes "$notes" \
            || gh release upload "$tag" dist/*.dmg --clobber
