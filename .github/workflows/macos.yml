# Builds BOTH plugins on a macOS runner and packs them into one disk image.
#
# Run it from the Actions tab ("Run workflow", pick the branch), or push a v* tag.
# Download "Fracture-and-Crate-macOS" from the finished run.
#
# On a public repository the run is free. On a private one, macOS runner minutes
# bill at 10x, so a ~12 minute run spends about 120 minutes of the account's
# quota; that is why this builds both products in one run rather than two.
#
# A v* tag also attaches the disk image to a GitHub release. On a public
# repository its link works for anyone, so plugins-site/site.json can point at it.
name: Build both plugins for macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14          # Apple Silicon; the build is universal anyway
    # a new repository's token is read-only by default; the release step
    # needs to create a release and upload the disk image to it
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: .juce
          key: juce-8.0.15

      # the measurements first: they need no toolchain beyond a compiler and
      # they fail in seconds rather than after a twelve minute build
      - name: DSP measurements
        run: |
          node plugin/tests/run.mjs
          node crate/tests/run.mjs

      # the same script the user runs on their own laptop, so a green run here
      # means that script works
      - name: Build, install and validate both
        run: ./build-macos-all.sh

      - name: Disk image
        run: ./packaging/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Fracture-and-Crate-macOS
          path: dist/*.dmg
          retention-days: 30

      - name: Attach to a release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.dmg \
            --title "FRACTURE and CRATE ${GITHUB_REF_NAME}" \
            --notes "Unsigned build. Open the disk image, right-click 'Install both plugins.command' and choose Open." \
            || gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber
